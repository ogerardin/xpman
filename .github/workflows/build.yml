name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install jpackage tools (deb/rpm)
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Configure JDK 25
        run: |
          echo "JAVA_HOME=${JAVA_HOME_25_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_25_X64}/bin" >> "$GITHUB_PATH"

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Compute version
        shell: bash
        run: |
          source scripts/ci-version.sh "${GITHUB_REF_NAME:-}"
          echo "REVISION=${REVISION}" >> "$GITHUB_ENV"
          echo "IS_SNAPSHOT=${IS_SNAPSHOT}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          mvn -v
          mvn -B -DskipTests clean package -Drevision="$REVISION" -Pinstallers

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist/artifacts
          SNAP=""
          [ "${IS_SNAPSHOT:-0}" = "1" ] && SNAP="-SNAPSHOT"
          for f in xpman-fx-dist/target/*.deb xpman-fx-dist/target/*.rpm; do
            base=$(basename "$f")
            cp "$f" "dist/artifacts/${base%.*}${SNAP}.${base##*.}"
          done
          for f in xpman-fx-dist/target/*-repackaged.jar; do
            cp "$f" "dist/artifacts/$(basename "$f" | sed -e "s/-fx-dist//" -e "s/repackaged/linux/")"
          done
          ls -l dist/artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux
          path: dist/artifacts
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      MAVEN_OPTS: -Dstdout.encoding=UTF-8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure JDK 25
        shell: pwsh
        run: |
          "JAVA_HOME=$env:JAVA_HOME_25_X64" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$env:JAVA_HOME_25_X64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Ensure WIX env var (jpackage MSI)
        shell: pwsh
        run: |
          if (-not $env:WIX) {
            $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1
            if ($wix) { "WIX=$($wix.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          }

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Compute version
        shell: bash
        run: |
          source scripts/ci-version.sh "${GITHUB_REF_NAME:-}"
          echo "REVISION=${REVISION}" >> "$GITHUB_ENV"
          echo "IS_SNAPSHOT=${IS_SNAPSHOT}" >> "$GITHUB_ENV"

      - name: Build
        shell: pwsh
        run: |
          mvn -v
          mvn -B -DskipTests clean package -Drevision="$env:REVISION" -Pinstallers

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist/artifacts
          SNAP=""
          [ "${IS_SNAPSHOT:-0}" = "1" ] && SNAP="-SNAPSHOT"
          for f in xpman-fx-dist/target/*.exe xpman-fx-dist/target/*.msi; do
            base=$(basename "$f")
            cp "$f" "dist/artifacts/${base%.*}${SNAP}.${base##*.}"
          done
          for f in xpman-fx-dist/target/*-repackaged.jar; do
            cp "$f" "dist/artifacts/$(basename "$f" | sed -e "s/-fx-dist//" -e "s/repackaged/windows/")"
          done
          ls -l dist/artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/artifacts
          if-no-files-found: error

  mac:
    name: macOS (ARM64)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure JDK 25
        run: |
          echo "JAVA_HOME=${JAVA_HOME_25_arm64:?JDK 25 (arm64) not found on this runner}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_25_arm64}/bin" >> "$GITHUB_PATH"

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Compute version
        shell: bash
        run: |
          source scripts/ci-version.sh "${GITHUB_REF_NAME:-}"
          echo "REVISION=${REVISION}" >> "$GITHUB_ENV"
          echo "IS_SNAPSHOT=${IS_SNAPSHOT}" >> "$GITHUB_ENV"

      - name: Build (incl. DMG via dmgbuild)
        run: |
          mvn -v
          mvn -B -DskipTests clean package -Drevision="$REVISION" -Pinstallers

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist/artifacts
          SNAP=""
          [ "${IS_SNAPSHOT:-0}" = "1" ] && SNAP="-SNAPSHOT"
          for f in xpman-fx-dist/target/*.pkg xpman-fx-dist/target/*.dmg; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            cp "$f" "dist/artifacts/${base%.*}${SNAP}.${base##*.}"
          done
          for f in xpman-fx-dist/target/*-repackaged.jar; do
            [ -e "$f" ] || continue
            cp "$f" "dist/artifacts/$(basename "$f" | sed -e "s/-fx-dist//" -e "s/repackaged/mac/")"
          done
          ls -l dist/artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mac
          path: dist/artifacts
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [linux, windows, mac]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine version
        run: |
          source scripts/ci-version.sh "${GITHUB_REF_NAME:-}"
          echo "VERSION=${REVISION}" >> "$GITHUB_ENV"
          echo "GH_VERSION=${GH_VERSION}" >> "$GITHUB_ENV"
          echo "IS_SNAPSHOT=${IS_SNAPSHOT}" >> "$GITHUB_ENV"
          echo "DATE=$(date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${IS_SNAPSHOT:-0}" = "1" ]; then
            # Pre-release: dedup same-day titles, then create
            gh release list --json tagName,name,isPrerelease --jq \
              '.[] | select(.isPrerelease and .name == "'"$VERSION ($DATE)"'") | .tagName' | \
              xargs -r gh release delete --yes --cleanup-tag
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              git log --format='- %s' "$PREV_TAG"..HEAD > "${RUNNER_TEMP}/release-notes.md"
            else
              git log --format='- %s' -30 HEAD > "${RUNNER_TEMP}/release-notes.md"
            fi
            gh release create "$GH_VERSION" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "$VERSION ($DATE)" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --prerelease
          else
            # Full release: clean up all pre-releases, then publish
            gh release list --prerelease --json tagName --jq '.[].tagName' | \
              xargs -r gh release delete --yes --cleanup-tag
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              git log --format='- %s' "$PREV_TAG"..HEAD > "${RUNNER_TEMP}/release-notes.md"
            else
              git log --format='- %s' -30 HEAD > "${RUNNER_TEMP}/release-notes.md"
            fi
            gh release create "$VERSION" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "$VERSION ($DATE)" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
