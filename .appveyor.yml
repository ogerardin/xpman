# AppVeyor CI (backup to CircleCI)
# Builds XPman (Java 25) into native installers via jpackage on Linux, macOS and Windows.

branches:
  only:
    - main

image:
  # TEMPORARILY DISABLED (mac DMG work in progress) - re-enable from git history.
  # - Visual Studio 2022
  # - Ubuntu
  - macos-sonoma

# Build mode defaults to "MSBuild" unless a top-level build_script is present, and
# `for:` matrix blocks are NOT applied when the image matrix has a single job (see
# AppVeyor support topic #23426), so the macOS build steps live here at the top
# level. The Linux/Windows for: blocks below override these settings once those
# images are re-enabled.
cache:
  - $HOME/.m2
  - $HOME/temurin25
  - $HOME/maven

build_script:
- sh: |
    # The image ships an old Homebrew (openjdk 21, no openjdk@25) and `brew update`
    # fails (git prompts for GitHub credentials), so fetch Temurin JDK 25 directly.
    export JDK_DIR="$HOME/temurin25"
    if [ ! -d "$JDK_DIR" ]; then
      echo "Downloading Temurin JDK 25..."
      curl -fL -o /tmp/jdk25.tar.gz "https://api.adoptium.net/v3/binary/latest/25/ga/mac/x64/jdk/hotspot/normal/eclipse"
      mkdir -p "$JDK_DIR"
      tar -xzf /tmp/jdk25.tar.gz -C "$JDK_DIR" --strip-components=1
    fi
    # No Homebrew on this image (it updates unrelated formulae and spews
    # warnings), so fetch a pinned Maven binary directly as well.
    export MAVEN_DIR="$HOME/maven"
    if [ ! -x "$MAVEN_DIR/bin/mvn" ]; then
      echo "Downloading Maven 3.9.11..."
      curl -fL -o /tmp/maven.tar.gz "https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz"
      mkdir -p "$MAVEN_DIR"
      tar -xzf /tmp/maven.tar.gz -C "$MAVEN_DIR" --strip-components=1
    fi
    export JAVA_HOME="$JDK_DIR/Contents/Home"
    export PATH="$JAVA_HOME/bin:$MAVEN_DIR/bin:$PATH"
    # Grant osascript and java the right to send Apple Events to Finder, used by
    # the custom jpackage DMG layout script. Tolerant: on headless CI the Finder
    # interaction may still time out, the DMG is then still produced without the
    # custom layout. Uses the TCC 'access' schema of macOS 11+ (auth_value, not the
    # legacy 'allowed' column) and restarts tccd so the grant is picked up.
    JavaPath=$(which java)
    TCC_DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
    sudo sqlite3 "$TCC_DB" <<SQL || true
    INSERT INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified)
    VALUES
      ('kTCCServiceAppleEvents','/usr/bin/osascript',1,2,4,1,NULL,NULL,0,'com.apple.finder',NULL,0,CAST(strftime('%s','now') AS INTEGER)),
      ('kTCCServiceAppleEvents','$JavaPath',1,2,4,1,NULL,NULL,0,'com.apple.finder',NULL,0,CAST(strftime('%s','now') AS INTEGER));
    SQL
    sudo pkill -9 tccd || true
    mvn -v
    mvn -B -DskipTests clean package

artifacts:
  - path: xpman-fx-dist/target/*.dmg
  - path: xpman-fx-dist/target/*.pkg
  - path: xpman-fx-dist/target/*-repackaged.jar

for:
-
  matrix:
    only:
      - image: Ubuntu
  stack: jdk 25
  init:
  - sh: |
      sudo apt-get update
      sudo apt-get install -y maven rpm fakeroot
  cache: $HOME/.m2
  build_script:
  - sh: |
      export JAVA_HOME=${JAVA_HOME_25_X64}
      export PATH=${JAVA_HOME_25_X64}/bin:$PATH
      mvn -v
      mvn -B -DskipTests clean package
  artifacts:
    - path: xpman-fx-dist/target/*.deb
    - path: xpman-fx-dist/target/*.rpm
    - path: xpman-fx-dist/target/*-repackaged.jar

-
  matrix:
    only:
      - image: Visual Studio 2022
  cache:
    - "%USERPROFILE%\\.m2"
  init:
  - ps: |
      $attempts = 0
      do {
        # --ignore-dependencies: imagemagick.app depends on kb2999226 (a UCRT
        # update only needed on Server 2012) whose V2 feed lookup is flaky;
        # Server 2022 already ships the UCRT so the dependency is unnecessary.
        choco install -y imagemagick.app --no-progress --ignore-dependencies
        if ($LASTEXITCODE -eq 0) { break }
        Start-Sleep -Seconds 15
        $attempts++
      } while ($attempts -lt 2)
      if ($LASTEXITCODE -ne 0) { throw "ImageMagick install failed" }
  build_script:
  - ps: |
      try {
        # ImageMagick is installed by choco in init but the machine PATH is not
        # refreshed between steps: resolve its install dir and prepend it.
        $imHome = (Get-ChildItem "C:\Program Files" -Directory -Filter "ImageMagick-*" | Select-Object -First 1).FullName
        # The VS 2022 image ships JDK 25 pre-installed (C:\Program Files\Java\jdk25)
        # but the default java on PATH is 1.8, so pin JAVA_HOME to JDK 25.
        $jdk = Get-ChildItem "C:\Program Files\Java" -Directory | Where-Object { $_.Name -match '^jdk-?25' } | Select-Object -First 1
        if (-not $jdk) { throw "JDK 25 not found under C:\Program Files\Java" }
        $env:JAVA_HOME = $jdk.FullName
        $env:Path = "$env:JAVA_HOME\bin;$imHome;$env:Path"
        mvn -v
        mvn -B -DskipTests clean package 2>&1
        Write-Host "Maven exit code: $LASTEXITCODE"
        if ($LASTEXITCODE -ne 0) { throw "Maven build failed with exit code $LASTEXITCODE" }
      } catch {
        Write-Host "BUILD SCRIPT EXCEPTION: $_"
        throw
      }
  artifacts:
    - path: xpman-fx-dist\target\*.exe
    - path: xpman-fx-dist\target\*.msi
    - path: xpman-fx-dist\target\*-repackaged.jar
