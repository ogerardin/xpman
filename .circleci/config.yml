# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

# Release publishing has moved to GitHub Actions (see .github/workflows/build.yml).
# This job is kept but disabled by default: it only runs when a pipeline is
# triggered with the "publish-release" parameter set to true (API or web app).
parameters:
  publish-release:
    type: boolean
    default: false

orbs:
  win: circleci/windows@2.4.0

jobs:
  build-linux:
    docker:
      - image: eclipse-temurin:25.0.3_9-jdk
    resource_class: medium
    steps:
      - run:
          name: Install build tools (git, maven, full JDK with jmods, rpm and fakeroot for jpackage)
          command: |
            apt-get update
            apt-get install -y git maven openjdk-25-jdk-headless rpm fakeroot
      - checkout
      - run:
          name: Generate cache seed
          command: find . -name 'pom.xml' | sort | xargs cat > effective-pom.xml
      - restore_cache:
          key: maven-{{ checksum "effective-pom.xml" }}-{{ arch }}
      - run:
          name: Compute version
          command: |
            source scripts/ci-version.sh "${CIRCLE_TAG:-}"
            echo "export REVISION=${REVISION}" >> "${BASH_ENV}"
            echo "export IS_SNAPSHOT=${IS_SNAPSHOT}" >> "${BASH_ENV}"
      - run:
          name: Build
          environment:
            JAVA_HOME: /usr/lib/jvm/java-25-openjdk-amd64
          command: |
            mvn -v
            mvn -B -DskipTests clean package -Drevision="${REVISION}" -Pinstallers
      - save_cache:
          key: maven-{{ checksum "effective-pom.xml" }}-{{ arch }}
          paths:
            - ~/.m2
      - run:
          name: Prepare artifacts
          command: |
            mkdir -p workspace/artifacts
            SNAP=""
            [ "${IS_SNAPSHOT:-0}" = "1" ] && SNAP="-SNAPSHOT"
            for f in xpman-fx-dist/target/*.deb xpman-fx-dist/target/*.rpm; do
              base=$(basename "$f")
              cp "$f" "workspace/artifacts/${base%.*}${SNAP}.${base##*.}"
            done
            for f in xpman-fx-dist/target/*-repackaged.jar; do cp "$f" "workspace/artifacts/$(basename "$f" | sed "s/-fx-dist//" | sed "s/repackaged/linux/")"; done
            ls -l workspace/artifacts
#      - store_artifacts:
#          path: workspace/artifacts
#          destination: linux
      - persist_to_workspace:
          root: workspace
          paths:
            - artifacts

  build-mac:
    macos:
      xcode: 26.6
    resource_class: macos.m1.medium.gen1
    environment:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - run:
          name: Install Java 25, Maven and Python
          command: |
            brew update
            brew install openjdk@25
            sudo ln -sfn "$(brew --prefix openjdk@25)/libexec/openjdk.jdk" /Library/Java/JavaVirtualMachines/openjdk.jdk
            brew install maven
            # dmgbuild (DMG packaging) requires Python >= 3.10
            brew install python@3.12
      - checkout
      - run:
          name: Generate cache seed
          command: find . -name 'pom.xml' | sort | xargs cat > effective-pom.xml
      - restore_cache:
          key: maven-{{ checksum "effective-pom.xml" }}-{{ arch }}
      - run:
          name: Compute version
          command: |
            source scripts/ci-version.sh "${CIRCLE_TAG:-}"
            echo "export REVISION=${REVISION}" >> "${BASH_ENV}"
            echo "export IS_SNAPSHOT=${IS_SNAPSHOT}" >> "${BASH_ENV}"
      - run:
          name: Build
          timeout: 25m
          command: |
            /usr/libexec/java_home -V
            export JAVA_HOME=`/usr/libexec/java_home -v 25`
            mvn -v
            mvn -B -DskipTests clean package -Drevision="${REVISION}" -Pinstallers
      - save_cache:
          key: maven-{{ checksum "effective-pom.xml" }}-{{ arch }}
          paths:
            - ~/.m2
      - run:
          name: Prepare artifacts
          command: |
            mkdir -p workspace/artifacts
            SNAP=""
            [ "${IS_SNAPSHOT:-0}" = "1" ] && SNAP="-SNAPSHOT"
            for f in xpman-fx-dist/target/*.pkg xpman-fx-dist/target/*.dmg; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              cp "$f" "workspace/artifacts/${base%.*}${SNAP}.${base##*.}"
            done
            for f in xpman-fx-dist/target/*-repackaged.jar; do
              [ -e "$f" ] && cp "$f" "workspace/artifacts/$(basename "$f" | sed "s/-fx-dist//" | sed "s/repackaged/mac/")"
            done
            ls -l workspace/artifacts
#      - store_artifacts:
#          path: workspace/artifacts
#          destination: mac
      - persist_to_workspace:
          root: workspace
          paths:
            - artifacts

  build-windows:
    executor:
      name: win/default
    steps:
      - checkout
      - run:
          name: Install scoop
          shell: powershell.exe
          command: |
            iwr -useb get.scoop.sh -outfile 'install.ps1'
            .\install.ps1 -RunAsAdmin
      - run:
          name: Install dependencies
          command: |
            scoop bucket add java
            scoop bucket add extras
            scoop bucket add versions
            # Workaround to avoid errors installing inno-setup, see https://github.com/ScoopInstaller/Extras/issues/13444
            scoop install versions/innounp-unicode openjdk25 maven imagemagick inno-setup wixtoolset3
      - run:
          name: Generate cache seed
          shell: cmd.exe
          command: type pom.xml xpman-api\pom.xml xpman-fx\pom.xml xpman-fx-dist\pom.xml > effective-pom.xml
      - restore_cache:
          key: maven-{{ checksum "effective-pom.xml" }}-{{ arch }}
      - run:
          name: Compute version
          shell: bash.exe
          command: |
            source scripts/ci-version.sh "${CIRCLE_TAG:-}"
            echo "export REVISION=${REVISION}" >> "${BASH_ENV}"
            echo "export IS_SNAPSHOT=${IS_SNAPSHOT}" >> "${BASH_ENV}"
            # Also write scoop shims to PATH so subsequent bash.exe steps can find mvn
            SCOOP_SHIMS=$(cygpath -u "$USERPROFILE/scoop/shims" 2>/dev/null || true)
            echo "export PATH=\"${SCOOP_SHIMS}:\${PATH}\"" >> "${BASH_ENV}"
      - run:
          name: Build
          timeout: 25m
          shell: bash.exe
          environment:
            MAVEN_OPTS: -Dstdout.encoding=UTF-8
          command: |
            mvn -v
            mvn -B -DskipTests clean package -Drevision="${REVISION}" -Pinstallers
      - save_cache:
          key: maven-{{ checksum "effective-pom.xml" }}-{{ arch }}
          paths:
            - C:\Users\circleci\.m2
      - run:
          name: Prepare artifacts
          shell: bash.exe
          command: |
            mkdir -p workspace/artifacts
            SNAP=""
            [ "${IS_SNAPSHOT:-0}" = "1" ] && SNAP="-SNAPSHOT"
            for f in xpman-fx-dist/target/*.exe xpman-fx-dist/target/*.msi; do
              base=$(basename "$f")
              cp "$f" "workspace/artifacts/${base%.*}${SNAP}.${base##*.}"
            done
            for f in xpman-fx-dist/target/*-repackaged.jar; do cp "$f" "workspace/artifacts/$(basename "$f" | sed "s/-fx-dist//" | sed "s/repackaged/windows/")"; done
            ls -l workspace/artifacts
#      - store_artifacts:
#          path: workspace\artifacts
#          destination: windows
      - persist_to_workspace:
          root: workspace
          paths:
            - artifacts

  publish-github-release:
    docker:
      - image: cibuilds/github:latest
    resource_class: small
    steps:
      - run:
          name: Install Maven
          command: |
            apk add maven
            mvn -v
      - checkout
      - attach_workspace:
          at: workspace
      - run:
          name: Publish Release on GitHub
          command: |
            ls -lR workspace
            source scripts/ci-version.sh "${CIRCLE_TAG:-}"
            DATE=$(date +%Y-%m-%d)
            PRERELEASE_FLAG=""
            [ "${IS_SNAPSHOT:-0}" = "1" ] && PRERELEASE_FLAG="-prerelease"
            ghr -u ${CIRCLE_PROJECT_USERNAME} \
              -r ${CIRCLE_PROJECT_REPONAME} \
              -c ${CIRCLE_SHA1} \
              -n "$REVISION ($DATE)" \
              -delete \
              ${PRERELEASE_FLAG} \
              "${REVISION}" \
              workspace/artifacts/

workflows:
  default:
    jobs:
      - build-linux:
          filters:
            branches:
              only: main
      - build-mac:
          filters:
            branches:
              only: main
      - build-windows:
          filters:
            branches:
              only: main
      - publish-github-release:
          requires:
            - build-linux
            - build-mac
            - build-windows
          filters: |
            pipeline.git.branch == "main" and pipeline.parameters.publish-release
